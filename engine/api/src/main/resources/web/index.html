<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>quay · engine workbench</title>
  <style>
    /* The site's own tokens, hand-carried: deep, smoke, paper, silver, signal. */
    :root {
      --deep: #11120d;
      --smoke: #181914;
      --paper: #f7f7f7;
      --silver: #a3a3a3;
      --signal: #51e076;
      --fault: #ff5c4d;
      --line: rgba(247, 247, 247, 0.14);
      --line-strong: rgba(247, 247, 247, 0.25);
      --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--deep);
      color: var(--paper);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
    @media (min-width: 640px) { .wrap { padding: 0 32px; } }

    /* micro labels, the site's mono register */
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--silver);
    }
    .eyebrow .key { color: var(--signal); }

    header { border-bottom: 1px solid var(--line); }
    header .bar {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 18px 0; gap: 16px;
    }
    .wordmark { font-size: 24px; letter-spacing: -0.04em; font-weight: 500; }
    .wordmark span { color: var(--signal); }
    .health { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--silver); }
    .health .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--silver); margin-right: 8px; vertical-align: 1px;
    }
    .health.up .dot { background: var(--signal); }
    .health.down .dot { background: var(--fault); }

    /* mode tabs, after the site header's underline tabs */
    .tabs { display: flex; gap: 24px; padding: 22px 0 0; }
    .tab {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--silver); padding: 8px 0; cursor: pointer;
    }
    .tab[aria-selected="true"] { color: var(--signal); border-bottom-color: var(--signal); }

    /* the load panel */
    .load {
      border: 1px solid var(--line); background: var(--smoke);
      padding: 20px; margin-top: 24px;
    }
    .load-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 260px; flex: 1; }
    select, textarea, input[type="text"] {
      background: var(--deep); color: var(--paper);
      border: 1px solid var(--line-strong); border-radius: 2px;
      font-family: var(--mono); font-size: 13px; padding: 10px 12px; width: 100%;
    }
    select:focus, textarea:focus { outline: none; border-color: var(--signal); }
    textarea { min-height: 170px; resize: vertical; line-height: 1.45; }
    .btn {
      background: var(--signal); color: var(--deep); border: none; border-radius: 2px;
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 12px 22px; cursor: pointer; font-weight: 600;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.ghost {
      background: none; color: var(--silver); border: 1px solid var(--line-strong); font-weight: 400;
    }
    .file-note { font-family: var(--mono); font-size: 11px; color: var(--silver); letter-spacing: 0.06em; }

    /* the refusal panel */
    .fault { border: 1px solid rgba(255, 92, 77, 0.5); padding: 20px 24px; margin-top: 24px; display: none; }
    .fault .title { font-size: 22px; letter-spacing: -0.03em; margin: 6px 0 4px; }
    .fault .detail { color: var(--silver); max-width: 640px; }
    .fault ul { margin: 10px 0 0; padding-left: 18px; color: var(--fault); font-family: var(--mono); font-size: 13px; }

    /* results */
    .result { margin-top: 32px; display: none; }
    .headline { font-size: clamp(22px, 4vw, 34px); letter-spacing: -0.035em; line-height: 1.15; max-width: 820px; }
    .headline .up { color: var(--signal); }
    .meta { margin-top: 8px; }

    .cards { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 24px; }
    @media (min-width: 800px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    .card { background: var(--deep); padding: 18px 20px; }
    .card .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--signal); }
    .row { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 8px 0; }
    .row:first-of-type { margin-top: 12px; }
    .row .k { color: var(--silver); }
    .row .v { font-family: var(--mono); font-size: 13px; }
    .row .v.good { color: var(--signal); }

    .bars { margin-top: 16px; max-width: 720px; }
    .bar-row { margin-top: 10px; }
    .bar-row .lbl { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--silver); }
    .bar { height: 10px; background: rgba(247, 247, 247, 0.06); border-radius: 2px; margin-top: 4px; }
    .bar span { display: block; height: 10px; border-radius: 2px; background: var(--signal); }
    .bar.muted span { background: rgba(247, 247, 247, 0.55); }

    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--silver); text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line-strong); font-weight: 500;
    }
    td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
    td.num { font-family: var(--mono); font-size: 13px; text-align: right; }
    th.num { text-align: right; }
    td .sub { color: var(--silver); font-family: var(--mono); font-size: 11px; margin-left: 8px; }
    .pill {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid var(--line-strong); border-radius: 2px; padding: 1px 8px; color: var(--silver);
    }
    .pill.gold { color: var(--signal); border-color: rgba(81, 224, 118, 0.4); }
    .pill.fwd { color: var(--paper); }

    details { margin-top: 20px; }
    summary { cursor: pointer; color: var(--silver); font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
    summary:hover { color: var(--paper); }

    .policy-cards { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 24px; }
    @media (min-width: 800px) { .policy-cards { grid-template-columns: repeat(3, 1fr); } }
    .signal-list td { font-family: var(--mono); font-size: 13px; }

    footer { border-top: 1px solid var(--line); margin-top: 56px; }
    footer .bar { padding: 20px 0; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    footer a { color: var(--silver); text-decoration: underline; text-underline-offset: 3px; }
    footer a:hover { color: var(--signal); }
    .mono-note { font-family: var(--mono); font-size: 11px; color: var(--silver); letter-spacing: 0.06em; }

    .policy-filter { display: flex; gap: 16px; margin-top: 24px; }
    .filter {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      background: none; border: 1px solid var(--line-strong); border-radius: 2px; color: var(--silver);
      padding: 5px 12px; cursor: pointer;
    }
    .filter[aria-pressed="true"] { background: var(--signal); color: var(--deep); border-color: var(--signal); }
    .section-gap { margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap bar">
      <p class="wordmark">Quay<span>.</span></p>
      <p class="health" id="health"><span class="dot"></span>engine workbench</p>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-face" role="tab" aria-selected="true">Slot a face</button>
      <button class="tab" id="tab-day" role="tab" aria-selected="false">Direct a putaway day</button>
    </div>

    <section class="load" aria-label="load a document">
      <div class="load-row">
        <div class="field">
          <label class="eyebrow" for="source"><span class="key">01</span> · load</label>
          <select id="source"></select>
        </div>
        <div class="field">
          <label class="eyebrow" for="file"><span class="key">02</span> · or your own document</label>
          <input type="file" id="file" accept=".json,application/json" />
          <p class="file-note">the file lands in the box below; edit it freely</p>
        </div>
        <button class="btn" id="run">Run the engine</button>
      </div>
      <div class="field" id="paste-wrap" style="display: none; margin-top: 16px;">
        <label class="eyebrow" for="paste"><span class="key">03</span> · the document</label>
        <textarea id="paste" spellcheck="false" placeholder="paste a face or putaway-day document"></textarea>
      </div>
    </section>

    <section class="fault" id="fault" role="alert">
      <p class="eyebrow"><span class="key" style="color: var(--fault);">refused</span> · <span id="fault-type"></span></p>
      <p class="title" id="fault-title"></p>
      <p class="detail" id="fault-detail"></p>
      <ul id="fault-reasons"></ul>
    </section>

    <!-- face result -->
    <section class="result" id="face-result">
      <p class="eyebrow"><span class="key" id="face-name"></span> · <span id="face-mode"></span> · <span id="face-ms"></span></p>
      <p class="headline" id="face-headline"></p>
      <div class="cards">
        <div class="card" id="face-proposal"></div>
        <div class="card" id="face-current"></div>
      </div>
      <div class="bars" id="face-bars"></div>
      <div id="face-assignment"></div>
      <details>
        <summary>the layout that arrived with the document</summary>
        <div id="face-current-assignment"></div>
      </details>
    </section>

    <!-- putaway result -->
    <section class="result" id="day-result">
      <p class="eyebrow"><span class="key" id="day-name"></span></p>
      <p class="headline" id="day-headline"></p>
      <div class="policy-cards" id="day-cards"></div>
      <div class="section-gap" id="day-signals"></div>
      <div class="policy-filter" id="day-filter"></div>
      <div id="day-directives"></div>
    </section>
  </main>

  <footer>
    <div class="wrap bar">
      <p class="mono-note">the same math the CLI prints, from the same jar · nothing is stored</p>
      <p class="mono-note"><a href="/v1/openapi.yaml">the wire contract</a> · <a href="/health">health</a></p>
    </div>
  </footer>

  <script>
    "use strict";

    // Page state: which use case, which fixture list, which filter.
    const state = { mode: "face", faces: [], days: [], filter: "all" };

    const $ = (id) => document.getElementById(id);

    // --- boot: health + the published fixture lists ---

    fetch("/health")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then(() => $("health").classList.add("up"))
      .catch(() => $("health").classList.add("down"));

    fetch("/v1/fixtures")
      .then((r) => r.json())
      .then((listed) => {
        state.faces = listed.faces || [];
        state.days = listed.days || [];
        renderSource();
      });

    // --- source picker: a published fixture, or paste your own document ---

    function renderSource() {
      const select = $("source");
      const names = state.mode === "face" ? state.faces : state.days;
      const placeholder = state.mode === "face" ? "a published face" : "a published putaway day";
      select.innerHTML = "";
      select.add(new Option("— " + placeholder + " —", ""));
      for (const name of names) select.add(new Option(name, "fixture:" + name));
      select.add(new Option("— paste your own document —", "paste"));
      select.value = "";
      $("paste-wrap").style.display = "none";
    }

    $("source").addEventListener("change", () => {
      $("paste-wrap").style.display = $("source").value === "paste" ? "block" : "none";
    });

    $("file").addEventListener("change", () => {
      const file = $("file").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        $("source").value = "paste";
        $("paste-wrap").style.display = "block";
        $("paste").value = String(reader.result);
      };
      reader.readAsText(file);
    });

    // --- mode tabs ---

    function setMode(mode) {
      state.mode = mode;
      $("tab-face").setAttribute("aria-selected", String(mode === "face"));
      $("tab-day").setAttribute("aria-selected", String(mode === "day"));
      renderSource();
    }
    $("tab-face").addEventListener("click", () => setMode("face"));
    $("tab-day").addEventListener("click", () => setMode("day"));

    // --- run: build the request body and POST it ---

    $("run").addEventListener("click", async () => {
      hide($("fault"));
      hide($("face-result"));
      hide($("day-result"));
      let body;
      const value = $("source").value;
      if (value === "paste") {
        const text = $("paste").value.trim();
        if (!text) {
          showFault("urn:workbench:empty", "Nothing to run", "Pick a fixture or paste a document first.");
          return;
        }
        try {
          body = state.mode === "face" ? { face: JSON.parse(text) } : { day: JSON.parse(text) };
        } catch {
          showFault("urn:workbench:not-json", "The document is not valid JSON", "Fix the text in the box and run again.");
          return;
        }
      } else if (value) {
        body = { fixture: value.slice("fixture:".length) };
      } else {
        showFault("urn:workbench:empty", "Nothing to run", "Pick a fixture or paste a document first.");
        return;
      }

      const endpoint = state.mode === "face" ? "/v1/slotting" : "/v1/putaway";
      let response;
      try {
        response = await fetch(endpoint, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
      } catch {
        showFault("urn:workbench:unreachable", "The engine did not answer", "The API jar is not reachable on this origin.");
        return;
      }
      const payload = await response.json();
      if (!response.ok) {
        showFault(payload.type, payload.title, payload.detail, payload.reasons);
        return;
      }
      if (state.mode === "face") renderFace(payload);
      else renderDay(payload);
    });

    // --- rendering: the face reading ---

    const m1 = (n) => Number(n).toFixed(1);
    const pct = (n) => (100 * n).toFixed(0) + "%";

    function renderFace(r) {
      $("face-name").textContent = r.faceName + " (" + r.faceId + ")";
      $("face-mode").textContent = "mode " + r.mode;
      $("face-ms").textContent = r.elapsedMillis + " ms";
      const cut = Math.round(100 * r.comparison.travelReduction);
      $("face-headline").innerHTML =
        cut > 0
          ? "The proposal walks <span class='up'>" + cut + "% less</span> than the layout that arrived with the document."
          : "The proposal does not beat the layout that arrived with the document.";

      scorecard($("face-proposal"), "proposal", r.proposal, r.proposal.cost.total);
      scorecard($("face-current"), "current", r.current, r.current.cost.total);

      const bars = $("face-bars");
      const max = Math.max(r.comparison.travelPickMetersBefore, r.comparison.travelPickMetersAfter);
      bars.innerHTML =
        barRow("proposed", r.comparison.travelPickMetersAfter, max, false) +
        barRow("current", r.comparison.travelPickMetersBefore, max, true);

      assignmentTable($("face-assignment"), r.proposal.assignment, "the proposal");
      assignmentTable($("face-current-assignment"), r.current.assignment, "the current layout");
      show($("face-result"));
    }

    function scorecard(node, tag, side, objective) {
      node.innerHTML =
        "<p class='tag'>" + tag + "</p>" +
        metric("travel", m1(side.metrics.travelPickMeters) + " pick-m") +
        metric("golden share", pct(side.metrics.goldenPickShare)) +
        metric("cube fit", pct(side.metrics.meanCubeFit)) +
        metric("heavy above limit", String(side.metrics.heavyAboveLimit)) +
        metric("affinity", m1(side.metrics.meanAffinitySteps) + " steps") +
        metric("objective", m1(objective));
    }

    function metric(k, v) {
      return "<div class='row'><span class='k'>" + k + "</span><span class='v'>" + v + "</span></div>";
    }

    function barRow(label, value, max, muted) {
      const width = max > 0 ? (100 * value) / max : 0;
      return (
        "<div class='bar-row'><div class='lbl'><span>" + label + "</span><span>" + m1(value) +
        " m</span></div><div class='bar" + (muted ? " muted" : "") + "'><span style='width:" +
        width.toFixed(1) + "%'></span></div></div>"
      );
    }

    function assignmentTable(node, rows, caption) {
      const head =
        "<p class='eyebrow section-gap'><span class='key'>" + caption + "</span> · " + rows.length +
        " placements</p>" +
        "<table><thead><tr><th>slot</th><th>carton</th><th>ergonomics</th><th>zone</th>" +
        "<th class='num'>return m</th><th class='num'>cube fit</th></tr></thead><tbody>";
      const body = rows
        .slice()
        .sort((a, b) => a.slotId.localeCompare(b.slotId))
        .map(
          (row) =>
            "<tr><td class='num'>" + row.slotId + "</td><td>" + row.skuName +
            "<span class='sub'>" + row.skuId + "</span></td><td>" + ergoPill(row.ergonomics) +
            "</td><td>" + row.zone + "</td><td class='num'>" + m1(row.returnMeters) +
            "</td><td class='num'>" + pct(row.cubeFit) + "</td></tr>"
        )
        .join("");
      node.innerHTML = head + body + "</tbody></table>";
    }

    function ergoPill(ergo) {
      return "<span class='pill" + (ergo === "golden" ? " gold" : "") + "'>" + ergo + "</span>";
    }

    // --- rendering: the putaway reading ---

    function renderDay(r) {
      $("day-name").textContent = r.dayName + " (" + r.dayId + ")";
      const velocity = r.outcomes.find((o) => o.policy === "velocity");
      const fork = r.outcomes.find((o) => o.policy === "random");
      const saved = fork.totals.putawayMeters - velocity.totals.putawayMeters;
      const percent = Math.round((100 * saved) / fork.totals.putawayMeters);
      $("day-headline").innerHTML =
        "Direction walks <span class='up'>" + m1(saved) + " m less</span> than the fork — " +
        percent + "% of the day's travel.";

      const cards = $("day-cards");
      cards.innerHTML = r.outcomes
        .map(
          (o) =>
            "<div class='card'><p class='tag'>" + o.policy + "</p>" +
            metric("putaway walk", m1(o.totals.putawayMeters) + " m") +
            metric("golden share", pct(o.totals.goldenShare)) +
            metric("to the face / reserve", o.totals.cartonsForward + " / " + o.totals.cartonsReserve) +
            metric("bays touched", String(o.totals.baysTouched)) +
            metric("refused", String(o.totals.refused)) + "</div>"
        )
        .join("");

      // The signal trace is identical under every policy; print it once.
      const signals = $("day-signals");
      const trace = velocity.signals;
      signals.innerHTML =
        "<p class='eyebrow'><span class='key'>the replenish trace</span> · the same under every policy</p>" +
        "<table class='signal-list'><thead><tr><th>sku</th><th class='num'>on hand</th><th>action</th>" +
        "<th class='num'>asks</th></tr></thead><tbody>" +
        trace
          .map(
            (s) =>
              "<tr><td>" + s.skuId + "</td><td class='num'>" + s.onHand.toFixed(0) + "</td><td>" +
              s.action + "</td><td class='num'>" + s.cartons + " cartons</td></tr>"
          )
          .join("") +
        "</tbody></table>";

      const filter = $("day-filter");
      filter.innerHTML = ["all", "velocity", "affinity", "random"]
        .map(
          (p) =>
            "<button class='filter' data-policy='" + p + "' aria-pressed='" +
            (state.filter === p) + "'>" + p + "</button>"
        )
        .join("");
      filter.querySelectorAll("button").forEach((b) =>
        b.addEventListener("click", () => {
          state.filter = b.dataset.policy;
          renderDay(r);
        })
      );
      directivesTable($("day-directives"), r.outcomes);
      show($("day-result"));
    }

    function directivesTable(node, outcomes) {
      const wanted = state.filter;
      const rows = [];
      for (const o of outcomes) {
        if (wanted !== "all" && o.policy !== wanted) continue;
        for (const d of o.directives) rows.push({ policy: o.policy, d });
      }
      const head =
        "<p class='eyebrow section-gap'><span class='key'>directives</span> · " + rows.length +
        " lines" + (wanted === "all" ? "" : " · " + wanted) + "</p>" +
        "<table><thead><tr><th>policy</th><th>receipt</th><th>carton</th><th>goes to</th>" +
        "<th class='num'>cartons</th><th class='num'>meters</th></tr></thead><tbody>";
      const body = rows
        .map(({ policy, d }) => {
          const target = d.destination === "forward" ? "the face" : d.slotId;
          return (
            "<tr><td><span class='pill" + (policy === "velocity" ? " gold" : "") + "'>" + policy +
            "</span></td><td class='num'>" + d.receiptId + "</td><td>" + d.skuName +
            "<span class='sub'>" + d.skuId + "</span></td><td>" + target +
            "</td><td class='num'>" + d.cartons + "</td><td class='num'>" + m1(d.putawayMeters) + "</td></tr>"
          );
        })
        .join("");
      node.innerHTML = head + body + "</tbody></table>";
    }

    // --- the refusal panel ---

    function showFault(type, title, detail, reasons) {
      $("fault-type").textContent = type || "";
      $("fault-title").textContent = title || "The engine refused the document";
      $("fault-detail").textContent = detail || "";
      $("fault-reasons").innerHTML = (reasons || []).map((r) => "<li>" + r + "</li>").join("");
      show($("fault"));
    }

    function show(node) { node.style.display = "block"; }
    function hide(node) { node.style.display = "none"; }
  </script>
</body>
</html>
